# Part 12 exercises 12.21 — development library app stack (hot reload)
services:
  mongo:
    image: mongo:7
    command: ["mongod", "--bind_ip_all"]
    volumes:
      - mongo_data:/data/db
      - ../nutshell part 8/library-backend/mongo/mongo-init.js:/docker-entrypoint-initdb.d/mongo-init.js:ro
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  backend:
    image: library-backend-dev
    build:
      context: ../nutshell part 8/library-backend
      dockerfile: dev.Dockerfile
    environment:
      MONGODB_URI: mongodb://mongo:27017/library
      JWT_SECRET: library-secret
      PORT: 4000
    volumes:
      - ../nutshell part 8/library-backend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      mongo:
        condition: service_healthy

  app:
    image: library-frontend-dev
    build:
      context: ../nutshell part 8/library-frontend
      dockerfile: dev.Dockerfile
    environment:
      VITE_GRAPHQL_HTTP: http://localhost:8081/graphql
      VITE_GRAPHQL_WS: ws://localhost:8081/graphql
    volumes:
      - ../nutshell part 8/library-frontend:/usr/src/app
      - /usr/src/app/node_modules
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8081:80"
    volumes:
      - ./nginx.dev.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - backend

volumes:
  mongo_data:
