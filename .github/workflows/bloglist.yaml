name: bloglist tests

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
    env:
      NODE_ENV: test
      TEST_MONGODB_URI: mongodb://127.0.0.1:27017/bloglist-test
      MONGODB_URI: mongodb://127.0.0.1:27017/bloglist
      SECRET: fullstacksecret
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install server dependencies
        working-directory: nutshell part 7/bloglist/server
        run: npm ci

      - name: Install client dependencies
        working-directory: nutshell part 7/bloglist/client
        run: npm ci

      - name: Install test dependencies
        working-directory: nutshell part 7/bloglist-tests
        run: npm ci

      - name: Install Playwright browsers
        working-directory: nutshell part 7/bloglist-tests
        run: npx playwright install --with-deps chromium

      - name: Run Playwright tests
        working-directory: nutshell part 7/bloglist-tests
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bloglist-playwright-report
          path: nutshell part 7/bloglist-tests/playwright-report/
          retention-days: 14
