name: Blog app E2E (Part 14)

on:
  push:
    branches: [main, master]
    paths:
      - 'nutshell part 14/blog-app/**'
      - '.github/workflows/blog-app-playwright.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'nutshell part 14/blog-app/**'
      - '.github/workflows/blog-app-playwright.yml'

defaults:
  run:
    working-directory: nutshell part 14/blog-app

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: nutshell part 14/blog-app/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright Browsers
        run: npx playwright install --with-deps chromium

      - name: Set up environment file
        run: |
          echo "DATABASE_URL=${{ secrets.DATABASE_URL }}" > .env.test
          echo "NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}" >> .env.test
          echo "NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL }}" >> .env.test
          echo "NODE_ENV=test" >> .env.test

      - name: Run database migrations
        run: npx drizzle-kit push

      - name: Run Playwright tests
        run: npx playwright test

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: blog-app-playwright-report
          path: nutshell part 14/blog-app/playwright-report/
          retention-days: 30
