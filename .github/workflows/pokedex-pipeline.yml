name: Pokedex CI/CD

on:
  push:
    branches: [main, master]
    paths:
      - 'nutshell part 11/full-stack-open-pokedex/**'
      - '.github/workflows/pokedex-pipeline.yml'
  pull_request:
    branches: [main, master]
    paths:
      - 'nutshell part 11/full-stack-open-pokedex/**'
      - '.github/workflows/pokedex-pipeline.yml'
    types: [opened, synchronize, reopened]

env:
  CI: true
  POKEDEX_DIR: nutshell part 11/full-stack-open-pokedex

defaults:
  run:
    working-directory: nutshell part 11/full-stack-open-pokedex

jobs:
  lint_test_build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: nutshell part 11/full-stack-open-pokedex/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run eslint

      - name: Build
        run: npm run build

      - name: Test
        run: npm test

  deploy:
    needs: lint_test_build
    if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: nutshell part 11/full-stack-open-pokedex/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Setup Fly.io CLI
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
