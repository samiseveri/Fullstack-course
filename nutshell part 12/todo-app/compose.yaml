services:
  mongo:
    image: mongo:8
    volumes:
      - mongo_data:/data/db

  redis:
    image: redis:7-alpine

  backend:
    image: todo-backend
    build:
      context: ./todo-backend
    environment:
      MONGO_URL: mongodb://mongo:27017/todos
      REDIS_URL: redis://redis:6379
    depends_on:
      - mongo
      - redis

  app:
    image: todo-front
    build:
      context: ./todo-frontend
      args:
        VITE_BACKEND_URL: /api
    depends_on:
      - backend

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app
      - backend

volumes:
  mongo_data:
